<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lathuile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9;
  --ink: #14213d;
  --muted: #5b6678;
  --accent: #1f6f5c;
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1623;
    --ink: #e8ecf4;
    --muted: #93a0b5;
    --accent: #5fc4a8;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1623;
  --ink: #e8ecf4;
  --muted: #93a0b5;
  --accent: #5fc4a8;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  display: flex;
  align-items: center;
  padding: 0 clamp(1.5rem, 8vw, 7rem);
}
main { max-width: 40rem; }
h1 {
  margin: 0;
  font-size: clamp(3rem, 12vw, 7rem);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
h1::after {
  content: "";
  display: block;
  width: 3.5rem;
  height: 4px;
  margin-top: 1.5rem;
  background: var(--accent);
}
p {
  margin: 1.5rem 0 0;
  font-size: 1.125rem;
  line-height: 1.6;
  color: var(--muted);
}
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Lathuile</h1>
  <p>Le site est en construction.</p>
</main>
</body>
</html>
